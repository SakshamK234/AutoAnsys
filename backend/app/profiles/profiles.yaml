# ════════════════════════════════════════════════════════════════════════════
# AutoAnsys run-profile presets — SINGLE SOURCE OF TRUTH
# ════════════════════════════════════════════════════════════════════════════
# A run profile (`individual_part` | `full_car`) selects domain/symmetry,
# ground/wheel BCs, reference values, convergence, and (later milestones) mesh
# workflow + SLURM sizing. `defaults` holds values shared by both profiles;
# each profile overrides only what differs. The loader (app/profiles/__init__.py)
# deep-merges defaults <- profile.
#
# Today this drives exactly what `apply_cfd_mode_defaults()` used to hardcode:
# the boundary-condition presets, iteration count, and reference area. Values
# here are byte-for-byte the previous Python literals, so behaviour is unchanged
# (pinned by tests/test_config_matches_schema.py in the full env).
#
# Keys marked "[Mn]" are placeholders reserved for a later milestone and are NOT
# wired into journal/SLURM generation yet — they document intended structure so
# the schema doesn't churn when those milestones land.
# ════════════════════════════════════════════════════════════════════════════

defaults:
  freestream_velocity_mps: 15.65
  reference_values:
    length_m: 2.8
    velocity_mps: 15.65
    density_kg_m3: 1.225      # sea-level air; [needs-cluster] confirm ARC operating density
  turbulence:
    model: k-omega-sst
    curvature_correction: true

profiles:

  # ── Component: single part / sub-assembly ───────────────────────────────
  individual_part:
    description: Single part or sub-assembly (wing element, endplate, strake).
    reference_values:
      area_m2: 1.2            # overridden per-part by the user / F1
    convergence:
      max_iterations: 300     # CFD_SOP (Individual Part)
    # SOP runs the component half-domain with a centreline symmetry plane, so the
    # integrated forces are halved → double them in post (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Component: a single exclusive node, shorter walltime (vs full car's 2 nodes).
    slurm:
      nodes: 1
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 6
    # Clean single part → Watertight workflow.
    mesh:
      workflow: watertight
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      pressure_outlets:
        - zone_name: outlet
          gauge_pressure: 0.0
      translating_walls:
        - zone_name: ground
          velocity_mps: 15.65
          direction_x: -1.0
          direction_y: 0.0
          direction_z: 0.0
      stationary_walls:
        - zone_name: walls
      symmetry_planes:
        - zone_name: symmetry

  # ── Full car: whole assembly (half-car + symmetry per maintainer) ───────
  full_car:
    description: Whole-car assembly, run half-car with a symmetry plane.
    reference_values:
      # [needs-cluster F1] this should be the FULL frontal area (half-model forces
      # are doubled below). 0.65 looks like a half-car value carried over from the
      # specialist script — confirm and replace with the true full frontal area.
      area_m2: 0.65
    convergence:
      max_iterations: 750     # Kevin Full Car / specialist script
    # Half-car run with a centreline symmetry plane → double the forces (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Full car: more cells → multiple exclusive nodes (needs the multi-node Fluent
    # launch, AUDIT S1) and a longer walltime.
    slurm:
      nodes: 2
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 24
    # Dirty multi-body assembly → Fault-tolerant (surface-wrapped) workflow.
    mesh:
      workflow: fault-tolerant
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      # NOTE (AUDIT C8): no pressure_outlets in the specialist preset — confirm (F4).
      translating_walls:
        - zone_name: ground
          velocity_mps: 15.65
          direction_x: -1.0
          direction_y: 0.0
          direction_z: 0.0
      rotating_walls:
        - zone_name: front-tire
          omega_rad_s: 77.0
          origin_x: 0.8264
          origin_y: 0.6125
          origin_z: 0.1998
          axis_x: 0.0
          axis_y: 1.0
          axis_z: 0.0
        - zone_name: rear-tire
          omega_rad_s: 77.0
          origin_x: -0.7056
          origin_y: 0.6125
          origin_z: 0.1998
          axis_x: 0.0
          axis_y: 1.0
          axis_z: 0.0
      slip_walls:
        - zone_name: tunnel-walls
        - zone_name: contact-patches
      # Half-car centreline symmetry plane (AUDIT C9 — was missing). Pairs with
      # symmetry.force_factor: 2.0 above.
      symmetry_planes:
        - zone_name: symmetry
