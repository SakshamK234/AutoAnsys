# ════════════════════════════════════════════════════════════════════════════
# AutoAnsys run-profile presets — SINGLE SOURCE OF TRUTH
# ════════════════════════════════════════════════════════════════════════════
# A run profile (`individual_part` | `full_car`) selects domain/symmetry,
# ground/wheel BCs, reference values, convergence, and (later milestones) mesh
# workflow + SLURM sizing. `defaults` holds values shared by both profiles;
# each profile overrides only what differs. The loader (app/profiles/__init__.py)
# deep-merges defaults <- profile.
#
# Today this drives exactly what `apply_cfd_mode_defaults()` used to hardcode:
# the boundary-condition presets, iteration count, and reference area. Values
# here are byte-for-byte the previous Python literals, so behaviour is unchanged
# (pinned by tests/test_config_matches_schema.py in the full env).
#
# Keys marked "[Mn]" are placeholders reserved for a later milestone and are NOT
# wired into journal/SLURM generation yet — they document intended structure so
# the schema doesn't churn when those milestones land.
# ════════════════════════════════════════════════════════════════════════════

defaults:
  freestream_velocity_mps: 15.65
  reference_values:
    length_m: 2.8
    velocity_mps: 15.65
    density_kg_m3: 1.225      # sea-level air; [needs-cluster] confirm ARC operating density
  turbulence:
    model: k-omega-sst
    curvature_correction: true

profiles:

  # ── Component: single part / sub-assembly ───────────────────────────────
  individual_part:
    description: Single part or sub-assembly (wing element, endplate, strake).
    reference_values:
      area_m2: 1.2            # overridden per-part by the user / F1
    convergence:
      max_iterations: 300     # CFD_SOP (Individual Part)
    # SOP runs the component half-domain with a centreline symmetry plane, so the
    # integrated forces are halved → double them in post (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Component: a single exclusive node, shorter walltime (vs full car's 2 nodes).
    slurm:
      nodes: 1
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 6
    # Clean single part → Watertight workflow.
    mesh:
      workflow: watertight
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      pressure_outlets:
        - zone_name: outlet
          gauge_pressure: 0.0
      translating_walls:
        - zone_name: ground
          velocity_mps: 15.65
          direction_x: -1.0
          direction_y: 0.0
          direction_z: 0.0
      stationary_walls:
        - zone_name: walls
      symmetry_planes:
        - zone_name: symmetry

  # ── Full car: whole assembly (half-car + symmetry per maintainer) ───────
  full_car:
    description: Whole-car assembly, run half-car with a symmetry plane.
    reference_values:
      # F1 (maintainer-provided): FULL frontal area 1.0 m² — pairs with the
      # half-model force doubling below. Replaces the 0.65 half-car placeholder
      # carried over from the specialist script.
      area_m2: 1.0
      # Moment reference length = wheelbase, 60.5 in × 0.0254 = 1.5367 m.
      length_m: 1.5367
    convergence:
      max_iterations: 750     # Kevin Full Car / specialist script
    # Half-car run with a centreline symmetry plane → double the forces (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Full car: more cells → multiple exclusive nodes (needs the multi-node Fluent
    # launch, AUDIT S1) and a longer walltime.
    slurm:
      nodes: 2
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 24
    # Specialist-validated watertight recipe (meshjournal.jou, V0.4-stepFC):
    # the full-car STEP models the tunnel-minus-car FLUID volume directly
    # ("only fluid regions with no voids" + wall-to-internal), with named face
    # labels (chassis / wings / wheels / trailing-edges / undertray /
    # suspension / whisker). Sizes in mm. Replaces the fault-tolerant/wrap
    # path, which is kept only for unlabelled dirty assemblies.
    mesh:
      workflow: watertight
      geometry_unit: mm
      describe_setup_type: fluid-only
      wall_to_internal: true
      pin_cad_import_options: false   # specialist import = task defaults
      # Specialist journal relies on task-default zone handling; the SOP
      # OriginalZones names do not exist in this CAD.
      original_zones: null
      surface_mesh:
        min_size: 1.0
        max_size: 50.0
        curvature_normal_angle: 18.0
        growth_rate: 1.2
      mesh_quality:
        surface_skewness_threshold: 0.6
        sq_min_size: 0.25          # trailing-edge face size
        auto_improve: true
        improve_volume: false      # specialist journal has no volume improve
      refinement_regions:
        - name: front-tire-wake
          max_size: 5
          labels: [front-left-wheel]
          x_min_ratio: 1.0         # wake stretch behind the wheel
        - name: rear-tire-wake
          max_size: 5
          labels: [rear-left-wheel]
          x_min_ratio: 1.5
          y_min_ratio: 2.5
        - name: nearfield
          max_size: 10
          # Absolute box (mm). y_min/z_min inherit GUI leftovers in the
          # recording (delta-state) — reproduced here for fidelity.
          x_min: -1500.0
          x_max: 2500.0
          y_min: 31.68325805664045
          y_max: 1000.0
          z_min: -38.14357504844666
          z_max: 2000.0
      local_sizing:
        - name: fw-rw-whisker
          type: face_sizing
          size: 5.0
          growth_rate: 1.2
          cells_per_gap: 1
          curvature_normal_angle: 18.0
          face_zones: [front-wing, rear-wing, whisker]
        - name: trailing-edges
          type: face_sizing
          size: 0.25
          growth_rate: 1.2
          cells_per_gap: 1
          curvature_normal_angle: 18.0
          face_zones: [trailing-edges]
        - name: undertray
          type: face_sizing
          size: 2.5
          growth_rate: 1.2
          cells_per_gap: 1
          curvature_normal_angle: 18.0
          face_zones: [undertray]
        - name: chassis
          type: face_sizing
          size: 10.0
          growth_rate: 1.2
          cells_per_gap: 1
          curvature_normal_angle: 18.0
          face_zones: [chassis]
        - name: wheels
          type: face_sizing
          size: 10.0
          growth_rate: 1.2
          cells_per_gap: 1
          curvature_normal_angle: 18.0
          face_zones: [front-left-wheel, rear-left-wheel]
      volume_mesh:
        fill: poly-hexcore
        hex_max_cell_length: 32.0
        num_layers: 6
        prism_labels: [chassis, front-left-wheel, front-wing, rear-left-wheel,
                       rear-wing, suspension, trailing-edges, undertray, whisker]
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      # F4 (maintainer-confirmed fix): the specialist preset omitted an outlet
      # (AUDIT C8); an external-aero domain needs one.
      pressure_outlets:
        - zone_name: outlet
          gauge_pressure: 0.0
      translating_walls:
        - zone_name: ground
          velocity_mps: 15.65
          direction_x: -1.0
          direction_y: 0.0
          direction_z: 0.0
      rotating_walls:
        - zone_name: front-tire
          omega_rad_s: 77.0
          origin_x: 0.8264
          origin_y: 0.6125
          origin_z: 0.1998
          axis_x: 0.0
          axis_y: 1.0
          axis_z: 0.0
        - zone_name: rear-tire
          omega_rad_s: 77.0
          origin_x: -0.7056
          origin_y: 0.6125
          origin_z: 0.1998
          axis_x: 0.0
          axis_y: 1.0
          axis_z: 0.0
      slip_walls:
        - zone_name: tunnel-walls
        - zone_name: contact-patches
      # Half-car centreline symmetry plane (AUDIT C9 — was missing). Pairs with
      # symmetry.force_factor: 2.0 above.
      symmetry_planes:
        - zone_name: symmetry
