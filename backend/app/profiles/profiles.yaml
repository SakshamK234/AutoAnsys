# ════════════════════════════════════════════════════════════════════════════
# AutoAnsys run-profile presets — SINGLE SOURCE OF TRUTH
# ════════════════════════════════════════════════════════════════════════════
# A run profile (`individual_part` | `full_car`) selects domain/symmetry,
# ground/wheel BCs, reference values, convergence, and (later milestones) mesh
# workflow + SLURM sizing. `defaults` holds values shared by both profiles;
# each profile overrides only what differs. The loader (app/profiles/__init__.py)
# deep-merges defaults <- profile.
#
# Today this drives exactly what `apply_cfd_mode_defaults()` used to hardcode:
# the boundary-condition presets, iteration count, and reference area. Values
# here are byte-for-byte the previous Python literals, so behaviour is unchanged
# (pinned by tests/test_config_matches_schema.py in the full env).
#
# Keys marked "[Mn]" are placeholders reserved for a later milestone and are NOT
# wired into journal/SLURM generation yet — they document intended structure so
# the schema doesn't churn when those milestones land.
# ════════════════════════════════════════════════════════════════════════════

defaults:
  freestream_velocity_mps: 15.65
  reference_values:
    length_m: 2.8
    velocity_mps: 15.65
    density_kg_m3: 1.225      # sea-level air; [needs-cluster] confirm ARC operating density
  turbulence:
    model: k-omega-sst
    curvature_correction: true

profiles:

  # ── Component: single part / sub-assembly ───────────────────────────────
  individual_part:
    description: Single part or sub-assembly (wing element, endplate, strake).
    reference_values:
      area_m2: 1.2            # overridden per-part by the user / F1
    convergence:
      max_iterations: 300     # CFD_SOP (Individual Part)
    # SOP runs the component half-domain with a centreline symmetry plane, so the
    # integrated forces are halved → double them in post (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Component: a single exclusive node, shorter walltime (vs full car's 2 nodes).
    slurm:
      nodes: 1
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 6
    # Clean single part → Watertight workflow.
    mesh:
      workflow: watertight
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      pressure_outlets:
        - zone_name: outlet
          gauge_pressure: 0.0
      translating_walls:
        - zone_name: ground
          velocity_mps: 15.65
          direction_x: -1.0
          direction_y: 0.0
          direction_z: 0.0
      stationary_walls:
        - zone_name: walls
      symmetry_planes:
        - zone_name: symmetry

  # ── Full car: whole assembly (half-car + symmetry per maintainer) ───────
  full_car:
    description: Whole-car assembly, run half-car with a symmetry plane.
    reference_values:
      # F1 (maintainer-provided): FULL frontal area 1.0 m² — pairs with the
      # half-model force doubling below. Replaces the 0.65 half-car placeholder
      # carried over from the specialist script.
      area_m2: 1.0
      # Moment reference length = wheelbase, 60.5 in × 0.0254 = 1.5367 m.
      length_m: 1.5367
    convergence:
      max_iterations: 750     # Kevin Full Car / specialist script
    # Half-car run with a centreline symmetry plane → double the forces (AUDIT C1).
    symmetry:
      half_model: true
      force_factor: 2.0
    # Full car: more cells → multiple exclusive nodes (needs the multi-node Fluent
    # launch, AUDIT S1) and a longer walltime.
    slurm:
      nodes: 2
      cores_per_node: 128
      memory_gb: 243
      walltime_hours: 24
    # Fault-tolerant WRAP recipe, validated end-to-end on ARC as the fc-series
    # (fc13→fc28, docs/CLUSTER_FINDINGS.md): the V0.4-stepFC export is a fluid
    # volume + overlapping car solids + a junk bounding-box body with NO usable
    # face labels, so the specialist watertight replay fails on sliver trailing
    # edges. The shrink-wrap is immune to slivers and duplicate solids. fc28
    # ran this in 49 min → drag 316 N / downforce 970 N (baseline BCs). The
    # boundary names below are produced by the geometric classifier, not the CAD.
    mesh:
      workflow: fault-tolerant
      geometry_unit: mm
      # Delete the redundant crate body that seals the car off from the flow.
      delete_bodies: [bounding_box]
      # Pre-wrap CAD-shell split so the tunnel box faces survive the wrap.
      prewrap_shell_split: true
      prewrap_shell_zone: 6
      # Scoped curvature+proximity on the car objects → 2.17 M cells (fc10);
      # bare defaults give a useless 89 k. Sizes in geometry units (mm).
      scoped_sizing:
        min_size: 2.0
        max_size: 16.0
        growth_rate: 1.2
        curvature_normal_angle: 18.0
        cells_per_gap: 3
      # Geometric boundary classification + slab carve (fc16/fc28): names the
      # tunnel planes by position and peels ground/top/rim strips off the fused
      # car-shell zone. carve_domain is the WRAPPED domain in SOLVER units (m) —
      # these are the V0.4 car's extents; a different car needs its own.
      classify_boundaries: true
      carve_domain:
        x_min: -12.454
        x_max: 3.941
        y_min: 0.0
        y_max: 3.209
        z_min: 0.0
        z_max: 3.726
        margin: 0.006
    # Forces integrate over the classifier's car zones (fc28: car + car-shell).
    reporting:
      body_wall_pattern: "car car-shell"
    boundary_conditions:
      velocity_inlets:
        - zone_name: inlet
          velocity: 15.65
          turbulent_intensity_pct: 5.0
          turbulent_viscosity_ratio: 10.0
      pressure_outlets:
        - zone_name: outlet
          gauge_pressure: 0.0
      # BASELINE: stationary ground + non-rotating wheels — the only live-
      # validated wall forms (fc28). The car body is one merged 'car' zone plus
      # the 'car-shell' imprint; the carved ground/rim strips default to
      # stationary walls. Swap to moving ground / rotating wheels (translating_/
      # rotating_walls) once the specialist's comparison conditions arrive AND
      # the per-component wheel zones are separated.
      stationary_walls:
        - zone_name: car
        - zone_name: car-shell
      # Tunnel top + far side are frictionless (slip) walls.
      slip_walls:
        - zone_name: farfield-top
        - zone_name: farfield-side
      # Half-car centreline symmetry plane. Pairs with force_factor: 2.0 above.
      symmetry_planes:
        - zone_name: symmetry
