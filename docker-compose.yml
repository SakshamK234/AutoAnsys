services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoansys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/autoansys --ignore-existing;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Recorded per run in run_metadata.json (reproducibility). Build with:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose up --build
        GIT_SHA: "${GIT_SHA:-unknown}"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoansys
      JWT_SECRET: dev-secret-change-in-production
      GIT_SHA: "${GIT_SHA:-unknown}"
      CLUSTER_MOCK_MODE: "${CLUSTER_MOCK_MODE:-true}"
      CLUSTER_HOST: "${CLUSTER_HOST:-cluster-login.example.edu}"
      CLUSTER_PORT: "${CLUSTER_PORT:-22}"
      CLUSTER_USER: "${CLUSTER_USER:-your_netid}"
      CLUSTER_KEY_PATH: "${CLUSTER_KEY_PATH:-/root/.ssh/id_cluster}"
      CLUSTER_WORKSPACE_BASE: "${CLUSTER_WORKSPACE_BASE:-/scratch/your_netid/autoansys/jobs}"
      CLUSTER_ACCOUNT: "${CLUSTER_ACCOUNT:-your_slurm_account}"
      FLUENT_MODULE: "${FLUENT_MODULE:-ANSYS/2025R1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      # entrypoint.sh is NOT mounted: Windows CRLF breaks Linux exec; use the image copy instead.
      # HPC: uncomment and mount your SSH private key; set CLUSTER_SSH_KEY_HOST_PATH in .env
      # - ${CLUSTER_SSH_KEY_HOST_PATH:?Set CLUSTER_SSH_KEY_HOST_PATH to your key file}:/root/.ssh/id_cluster:ro

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoansys
      JWT_SECRET: dev-secret-change-in-production
      GIT_SHA: "${GIT_SHA:-unknown}"
      CLUSTER_MOCK_MODE: "${CLUSTER_MOCK_MODE:-true}"
      CLUSTER_HOST: "${CLUSTER_HOST:-cluster-login.example.edu}"
      CLUSTER_PORT: "${CLUSTER_PORT:-22}"
      CLUSTER_USER: "${CLUSTER_USER:-your_netid}"
      CLUSTER_KEY_PATH: "${CLUSTER_KEY_PATH:-/root/.ssh/id_cluster}"
      CLUSTER_WORKSPACE_BASE: "${CLUSTER_WORKSPACE_BASE:-/scratch/your_netid/autoansys/jobs}"
      CLUSTER_ACCOUNT: "${CLUSTER_ACCOUNT:-your_slurm_account}"
      FLUENT_MODULE: "${FLUENT_MODULE:-ANSYS/2025R1}"
    volumes:
      - ./backend/app:/app/app
      # HPC: uncomment and mount your SSH private key; set CLUSTER_SSH_KEY_HOST_PATH in .env
      # - ${CLUSTER_SSH_KEY_HOST_PATH:?Set CLUSTER_SSH_KEY_HOST_PATH to your key file}:/root/.ssh/id_cluster:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # NOTE: --scheduler celery.beat.PersistentScheduler (the default) writes
    # the schedule to celerybeat-schedule and IGNORES new beat_schedule entries
    # added in code on subsequent restarts. Use the in-memory scheduler so any
    # change to celery_app.conf.beat_schedule is picked up immediately on
    # restart (e.g. when poll-active-meshes was added alongside poll-active-jobs).
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.beat.Scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      CLUSTER_MOCK_MODE: "${CLUSTER_MOCK_MODE:-true}"
    # Live-mount the backend source so beat sees code changes (new schedule
    # entries, task modules) without rebuilding the image. Without this mount,
    # beat runs the snapshot from `docker compose build` and silently misses
    # any task added later — e.g. poll-active-meshes was registered in code
    # but never fired because beat was using a pre-mesh image.
    volumes:
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  postgres_data:
  minio_data:
