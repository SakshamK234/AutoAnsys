version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoansys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/autoansys --ignore-existing;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoansys
      JWT_SECRET: dev-secret-change-in-production
      CLUSTER_MOCK_MODE: "false"
      CLUSTER_HOST: "tinkercliffs1.arc.vt.edu"
      CLUSTER_PORT: "22"
      CLUSTER_USER: "sakshamkumar"
      CLUSTER_KEY_PATH: "/root/.ssh/arc_autoansys"
      CLUSTER_WORKSPACE_BASE: "/scratch/sakshamkumar/autoansys/jobs"
      CLUSTER_ACCOUNT: "fsae"
      FLUENT_MODULE: "ANSYS/2025R1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/entrypoint.sh:/app/entrypoint.sh
      - ~/.ssh/arc_autoansys:/root/.ssh/arc_autoansys:ro

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: autoansys
      JWT_SECRET: dev-secret-change-in-production
      CLUSTER_MOCK_MODE: "false"
      CLUSTER_HOST: "tinkercliffs1.arc.vt.edu"
      CLUSTER_PORT: "22"
      CLUSTER_USER: "sakshamkumar"
      CLUSTER_KEY_PATH: "/root/.ssh/arc_autoansys"
      CLUSTER_WORKSPACE_BASE: "/scratch/sakshamkumar/autoansys/jobs"
      CLUSTER_ACCOUNT: "fsae"
      FLUENT_MODULE: "ANSYS/2025R1"
    volumes:
      - ./backend/app:/app/app
      - ~/.ssh/arc_autoansys:/root/.ssh/arc_autoansys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/autoansys
      REDIS_URL: redis://redis:6379/0
      CLUSTER_MOCK_MODE: "false"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  postgres_data:
  minio_data:
